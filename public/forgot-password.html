<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Forgot Password</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;

}

body{

background:#0b0f19;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;

}

.box{

width:100%;
max-width:420px;
background:#161d2d;
padding:35px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.4);

}

.logo{

text-align:center;
margin-bottom:25px;

}

.logo i{

font-size:60px;
color:#f59e0b;

}

.logo h2{

color:white;
margin-top:15px;

}

.logo p{

color:#9ca3af;
margin-top:8px;

}

.step{

display:none;

}

.step.active{

display:block;

}

label{

display:block;
color:#d1d5db;
margin-bottom:7px;

}

input{

width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#20293d;
color:white;
font-size:15px;
margin-bottom:18px;

}

.password{

position:relative;

}

.password i{

position:absolute;
right:15px;
top:14px;
color:#9ca3af;
cursor:pointer;

}

button{

width:100%;
padding:15px;
background:#f59e0b;
border:none;
border-radius:12px;
font-size:16px;
font-weight:bold;
cursor:pointer;

}

button:hover{

background:#ffb300;

}

.back{

text-align:center;
margin-top:20px;

}

.back a{

color:#f59e0b;
text-decoration:none;

}

.message{

text-align:center;
margin-top:15px;
color:#10b981;

}


/* ===== Custom App Popup ===== */
.app-popup-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.72);
  display:none;align-items:center;justify-content:center;
  z-index:99999;padding:20px;
  backdrop-filter:blur(4px);
}
.app-popup-overlay.open{display:flex;animation:appPopupFade .2s ease;}
@keyframes appPopupFade{from{opacity:0}to{opacity:1}}
.app-popup{
  background:#161d2d;border:1px solid #2a3548;border-radius:18px;
  width:100%;max-width:340px;padding:28px 24px 22px;
  text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.55);
  animation:appPopupUp .25s ease;
}
@keyframes appPopupUp{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.app-popup .brand{
  font-size:.75rem;font-weight:700;letter-spacing:.12em;
  color:#f59e0b;text-transform:uppercase;margin-bottom:14px;
}
.app-popup .icon{
  width:56px;height:56px;border-radius:50%;margin:0 auto 14px;
  display:flex;align-items:center;justify-content:center;font-size:1.5rem;
}
.app-popup.success .icon{background:rgba(16,185,129,.15);color:#10b981;}
.app-popup.error .icon{background:rgba(239,68,68,.15);color:#ef4444;}
.app-popup.info .icon{background:rgba(245,158,11,.15);color:#f59e0b;}
.app-popup h3{color:#fff;font-size:1.15rem;margin-bottom:8px;font-weight:600;}
.app-popup p{color:#9ca3af;font-size:.9rem;line-height:1.45;margin-bottom:20px;}
.app-popup .ok-btn{
  width:100%;padding:12px;border:none;border-radius:10px;
  background:#f59e0b;color:#111;font-weight:700;font-size:.95rem;
  cursor:pointer;font-family:inherit;
}
.app-popup .ok-btn:hover{background:#d97706;}
.app-popup .ok-btn:disabled{opacity:.7;cursor:not-allowed;}

</style>

</head>


<body>


<div class="box">


<div class="logo">

<i class="fa-solid fa-lock"></i>

<h2>Password Reset</h2>

<p>Recover your account securely</p>

</div>


<!-- STEP 1 -->

<div class="step active" id="step1">


<label>Email or Phone</label>

<input
type="text"
id="account"
placeholder="Enter email or phone">


<button onclick="sendCode()">

Send Reset Code

</button>


</div>


<!-- STEP 2 -->

<div class="step" id="step2">


<label>Verification Code</label>

<input
type="number"
id="code"
placeholder="Enter OTP code">


<button onclick="verifyCode()">

Verify Code

</button>


</div>


<!-- STEP 3 -->

<div class="step" id="step3">


<label>New Password</label>


<div class="password">

<input
type="password"
id="newPassword"
placeholder="Create new password">


<i class="fa-solid fa-eye"
id="eye"></i>


</div>


<label>Confirm Password</label>


<input
type="password"
id="confirmNewPassword"
placeholder="Confirm password">


<button onclick="resetPassword()">

Reset Password

</button>


</div>


<div class="message" id="message"></div>


<div class="back">

<a href="login.html">

Back to Login

</a>

</div>


</div>
<script>

function showAppPopup(options){
  const opts = typeof options === 'string' ? { message: options, type: 'info' } : (options || {});
  const type = opts.type || 'info';
  const title = opts.title || (type === 'success' ? 'Success' : type === 'error' ? 'Error' : 'Notice');
  const message = opts.message || '';
  const onOk = opts.onOk || null;
  let overlay = document.getElementById('appPopupOverlay');
  if (!overlay) {
    document.body.insertAdjacentHTML('beforeend', `
<div class="app-popup-overlay" id="appPopupOverlay">
  <div class="app-popup success" id="appPopup">
    <div class="brand">JAZTECH</div>
    <div class="icon" id="appPopupIcon"><i class="fa-solid fa-check"></i></div>
    <h3 id="appPopupTitle">Success</h3>
    <p id="appPopupMessage">Done.</p>
    <button type="button" class="ok-btn" id="appPopupOk">OK</button>
  </div>
</div>
`);
    overlay = document.getElementById('appPopupOverlay');
  }
  const box = document.getElementById('appPopup');
  const icon = document.getElementById('appPopupIcon');
  const titleEl = document.getElementById('appPopupTitle');
  const msgEl = document.getElementById('appPopupMessage');
  const okBtn = document.getElementById('appPopupOk');
  box.className = 'app-popup ' + type;
  if (type === 'success') icon.innerHTML = '<i class="fa-solid fa-check"></i>';
  else if (type === 'error') icon.innerHTML = '<i class="fa-solid fa-xmark"></i>';
  else icon.innerHTML = '<i class="fa-solid fa-circle-info"></i>';
  titleEl.textContent = title;
  msgEl.textContent = message;
  overlay.classList.add('open');
  okBtn.onclick = function(){
    overlay.classList.remove('open');
    if (typeof onOk === 'function') onOk();
  };
}
// Prevent double-submit on forms
function lockButton(btn, loadingText){
  if (!btn) return function unlock(){};
  if (btn.dataset.locked === '1') return null; // already locked
  btn.dataset.locked = '1';
  btn.dataset.prevText = btn.innerHTML;
  btn.disabled = true;
  btn.style.opacity = '0.7';
  btn.style.cursor = 'not-allowed';
  if (loadingText) btn.innerHTML = loadingText;
  return function unlock(){
    btn.dataset.locked = '0';
    btn.disabled = false;
    btn.style.opacity = '';
    btn.style.cursor = '';
    btn.innerHTML = btn.dataset.prevText || btn.innerHTML;
  };
}



const eye=document.getElementById("eye");

const password=document.getElementById("newPassword");

eye.addEventListener("click",()=>{

if(password.type==="password"){

password.type="text";

eye.classList.remove("fa-eye");

eye.classList.add("fa-eye-slash");

}else{

password.type="password";

eye.classList.remove("fa-eye-slash");

eye.classList.add("fa-eye");

}

});

function showStep(step){

document.querySelectorAll(".step").forEach(s=>{

s.classList.remove("active");

});

document.getElementById(step).classList.add("active");

}

async function sendCode(){

const account=

document.getElementById("account").value.trim();

if(account===""){

showAppPopup({ type: 'info', title: 'Notice', message: 'Enter your email or phone number.' });

return;

}

try{

const response=await fetch("/api/forgot-password",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({account})

});

const result=await response.json();

if(response.ok){

document.getElementById("message").innerText=

"A verification code has been sent.";

showStep("step2");

}else{

showAppPopup({ type: 'error', title: 'Error', message: result.message || 'Unable to send code.' });

}

}catch(error){

console.error(error);

showAppPopup({ type: 'error', title: 'Error', message: 'Server connection failed.' });

}

}

async function verifyCode(){

const code=

document.getElementById("code").value.trim();

if(code===""){

showAppPopup({ type: 'info', title: 'Notice', message: 'Enter the verification code.' });

return;

}

try{

const response=await fetch("/api/verify-reset-code",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({code})

});

const result=await response.json();

if(response.ok){

document.getElementById("message").innerText=

"Code verified successfully.";

showStep("step3");

}else{

showAppPopup({ type: 'error', title: 'Error', message: result.message || 'Invalid verification code.' });

}

}catch(error){

console.error(error);

showAppPopup({ type: 'error', title: 'Error', message: 'Server connection failed.' });

}

}

async function resetPassword(){

const newPassword=

document.getElementById("newPassword").value;

const confirmPassword=

document.getElementById("confirmNewPassword").value;

if(newPassword.length<8){

showAppPopup({ type: 'error', title: 'Error', message: 'Password must be at least 8 characters.' });

return;

}

if(newPassword!==confirmPassword){

showAppPopup({ type: 'info', title: 'Notice', message: 'Passwords do not match.' });

return;

}

try{

const response=await fetch("/api/reset-password",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

password:newPassword

})

});

const result=await response.json();

if(response.ok){

showAppPopup({ type: 'success', title: 'Success', message: 'Password reset successfully.' });

window.location.href="login.html";

}else{

showAppPopup({ type: 'error', title: 'Error', message: result.message || 'Password reset failed.' });

}

}catch(error){

console.error(error);

showAppPopup({ type: 'error', title: 'Error', message: 'Unable to connect to the server.' });

}

}

</script>


<div class="app-popup-overlay" id="appPopupOverlay">
  <div class="app-popup success" id="appPopup">
    <div class="brand">JAZTECH</div>
    <div class="icon" id="appPopupIcon"><i class="fa-solid fa-check"></i></div>
    <h3 id="appPopupTitle">Success</h3>
    <p id="appPopupMessage">Done.</p>
    <button type="button" class="ok-btn" id="appPopupOk">OK</button>
  </div>
</div>

</body>

</html>
