<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Create Account</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{

background:#0b0f19;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;

}

.register-box{

width:100%;
max-width:450px;
background:#161d2d;
padding:35px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.35);

}

.logo{

text-align:center;
margin-bottom:25px;

}

.logo i{

font-size:60px;
color:#f59e0b;

}

.logo h2{

margin-top:15px;
color:white;

}

.logo p{

color:#9ca3af;

}

.input-group{

margin-bottom:16px;

}

.input-group label{

display:block;
margin-bottom:6px;
color:#d1d5db;

}

.input-group input{

width:100%;
padding:14px;
background:#20293d;
border:none;
border-radius:10px;
color:white;
font-size:15px;

}

.password-box{

position:relative;

}

.password-box i{

position:absolute;
right:15px;
top:16px;
cursor:pointer;
color:#9ca3af;

}

.terms{

display:flex;
align-items:flex-start;
gap:10px;
margin:15px 0;
font-size:14px;
color:#d1d5db;

}

.terms a{

color:#f59e0b;
text-decoration:none;

}

button{

width:100%;
padding:15px;
background:#f59e0b;
border:none;
border-radius:12px;
font-size:16px;
font-weight:bold;
cursor:pointer;

}

button:hover{

background:#ffb300;

}

.loading{

display:none;
margin-top:15px;
text-align:center;
color:#f59e0b;

}

.login{

text-align:center;
margin-top:20px;
color:#9ca3af;

}

.login a{

color:#f59e0b;
font-weight:bold;
text-decoration:none;

}


/* ===== Custom App Popup ===== */
.app-popup-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.72);
  display:none;align-items:center;justify-content:center;
  z-index:99999;padding:20px;
  backdrop-filter:blur(4px);
}
.app-popup-overlay.open{display:flex;animation:popupFade .2s ease;}
@keyframes popupFade{from{opacity:0}to{opacity:1}}
.app-popup{
  background:#161d2d;border:1px solid #2a3548;border-radius:18px;
  width:100%;max-width:340px;padding:28px 24px 22px;
  text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.55);
  animation:popupUp .25s ease;
}
@keyframes popupUp{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.app-popup .brand{
  font-size:.75rem;font-weight:700;letter-spacing:.12em;
  color:#f59e0b;text-transform:uppercase;margin-bottom:14px;
}
.app-popup .icon{
  width:56px;height:56px;border-radius:50%;margin:0 auto 14px;
  display:flex;align-items:center;justify-content:center;font-size:1.5rem;
}
.app-popup.success .icon{background:rgba(16,185,129,.15);color:#10b981;}
.app-popup.error .icon{background:rgba(239,68,68,.15);color:#ef4444;}
.app-popup.info .icon{background:rgba(245,158,11,.15);color:#f59e0b;}
.app-popup h3{
  color:#fff;font-size:1.15rem;margin-bottom:8px;font-weight:600;
}
.app-popup p{
  color:#9ca3af;font-size:.9rem;line-height:1.45;margin-bottom:20px;
}
.app-popup .ok-btn{
  width:100%;padding:12px;border:none;border-radius:10px;
  background:#f59e0b;color:#111;font-weight:700;font-size:.95rem;
  cursor:pointer;font-family:inherit;
}
.app-popup .ok-btn:hover{background:#d97706;}

</style>

</head>

<body>

<div class="register-box">

<div class="logo">

<i class="fa-solid fa-user-plus"></i>

<h2>Create Account</h2>

<p>Join JazTech Investment</p>

</div>

<form id="registerForm">

<div class="input-group">

<label>Full Name</label>

<input
type="text"
id="name"
placeholder="Enter your full name"
required>

</div>

<div class="input-group">

<label>Email Address</label>

<input
type="email"
id="email"
placeholder="Enter your email"
required>

</div>

<div class="input-group">

<label>Phone Number</label>

<input
type="tel"
id="phone"
placeholder="Enter phone number"
required>

</div>

<div class="input-group">

<label>Password</label>

<div class="password-box">

<input
type="password"
id="password"
placeholder="Create password"
required>

<i class="fa-solid fa-eye"
id="togglePassword"></i>

</div>

</div>

<div class="input-group">

<label>Confirm Password</label>

<div class="password-box">

<input
type="password"
id="confirmPassword"
placeholder="Confirm password"
required>

<i class="fa-solid fa-eye"
id="toggleConfirmPassword"></i>

</div>

</div>

<div class="input-group">

<label>Referral Code (Optional)</label>

<input
type="text"
id="referralCode"
placeholder="Enter referral code">

</div>

<div class="terms">

<input
type="checkbox"
id="terms"
required>

<label for="terms">

I agree to the

<a href="terms.html">

Terms & Conditions

</a>

</label>

</div>

<button type="submit">

Create Account

</button>

<div
class="loading"
id="loading">

Creating your account...

</div>

<div class="login">

Already have an account?

<a href="login.html">

Login

</a>

</div>

</form>

</div>
<script>


function lockButton(btn, loadingText){
  if (!btn) return function unlock(){};
  if (btn.dataset.locked === '1') return null;
  btn.dataset.locked = '1';
  btn.dataset.prevText = btn.innerHTML;
  btn.disabled = true;
  btn.style.opacity = '0.7';
  btn.style.cursor = 'not-allowed';
  if (loadingText) btn.innerHTML = loadingText;
  return function unlock(){
    btn.dataset.locked = '0';
    btn.disabled = false;
    btn.style.opacity = '';
    btn.style.cursor = '';
    if (btn.dataset.prevText) btn.innerHTML = btn.dataset.prevText;
  };
}

function showAppPopup(options){
  const opts = typeof options === 'string'
    ? { message: options, type: 'info' }
    : (options || {});
  const type = opts.type || 'info';
  const title = opts.title || (type === 'success' ? 'Success' : type === 'error' ? 'Error' : 'Notice');
  const message = opts.message || '';
  const onOk = opts.onOk || null;

  const overlay = document.getElementById('appPopupOverlay');
  const box = document.getElementById('appPopup');
  const icon = document.getElementById('appPopupIcon');
  const titleEl = document.getElementById('appPopupTitle');
  const msgEl = document.getElementById('appPopupMessage');
  const okBtn = document.getElementById('appPopupOk');

  box.className = 'app-popup ' + type;
  if (type === 'success') icon.innerHTML = '<i class="fa-solid fa-check"></i>';
  else if (type === 'error') icon.innerHTML = '<i class="fa-solid fa-xmark"></i>';
  else icon.innerHTML = '<i class="fa-solid fa-circle-info"></i>';

  titleEl.textContent = title;
  msgEl.textContent = message;
  overlay.classList.add('open');

  okBtn.onclick = function(){
    overlay.classList.remove('open');
    if (typeof onOk === 'function') onOk();
  };
}



const password =
document.getElementById("password");

const confirmPassword =
document.getElementById("confirmPassword");

document.getElementById("togglePassword")
.addEventListener("click",function(){

password.type =
password.type==="password" ? "text":"password";

this.classList.toggle("fa-eye");
this.classList.toggle("fa-eye-slash");

});

document.getElementById("toggleConfirmPassword")
.addEventListener("click",function(){

confirmPassword.type =
confirmPassword.type==="password" ? "text":"password";

this.classList.toggle("fa-eye");
this.classList.toggle("fa-eye-slash");

});

document.getElementById("registerForm")
.addEventListener("submit",registerUser);

async function registerUser(e){

e.preventDefault();
const regBtn = e.submitter || document.querySelector('#registerForm button[type="submit"]') || document.querySelector('#registerForm button');
const unlock = lockButton(regBtn, 'Creating account…');
if (!unlock) return;

if(password.value!==confirmPassword.value){
showAppPopup({ type: 'error', title: 'Check Password', message: 'Passwords do not match.' });
unlock();
return;
}

if(password.value.length<8){
showAppPopup({ type: 'error', title: 'Weak Password', message: 'Password must be at least 8 characters.' });
unlock();
return;
}

if(!document.getElementById("terms").checked){
showAppPopup({ type: 'info', title: 'Terms Required', message: 'Please accept the Terms & Conditions to continue.' });
unlock();
return;
}

document.getElementById("loading").style.display="block";

const user={

name:
document.getElementById("name").value.trim(),

email:
document.getElementById("email").value.trim(),

phone:
document.getElementById("phone").value.trim(),

password:
password.value,

referralCode:
document.getElementById("referralCode").value.trim()

};

try{

const response=await fetch("/api/register",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify(user)

});

const result=await response.json();

document.getElementById("loading").style.display="none";

if(response.ok){

if(result.token){

localStorage.setItem("token",result.token);

}

if(result.user){

localStorage.setItem(
"user",
JSON.stringify(result.user)
);

}

document.getElementById("loading").style.display="none";
unlock();
showAppPopup({
  type: 'success',
  title: 'Registration Successful',
  message: 'Your account has been created. Welcome to JAZTECH!',
  onOk: function(){ window.location.href = 'index.html'; }
});

}else{

document.getElementById("loading").style.display="none";
unlock();
showAppPopup({ type: 'error', title: 'Registration Failed', message: result.message || 'Registration failed.' });

}

}catch(error){

document.getElementById("loading").style.display="none";

console.error(error);

document.getElementById("loading").style.display="none";
unlock();
showAppPopup({ type: 'error', title: 'Connection Error', message: 'Unable to connect to the server. Please try again.' });

}

}

window.addEventListener("load",()=>{

const token=
localStorage.getItem("token") ||
sessionStorage.getItem("token");

if(token){

window.location.href="index.html";

}

});

</script>


<div class="app-popup-overlay" id="appPopupOverlay">
  <div class="app-popup success" id="appPopup">
    <div class="brand">JAZTECH</div>
    <div class="icon" id="appPopupIcon"><i class="fa-solid fa-check"></i></div>
    <h3 id="appPopupTitle">Success</h3>
    <p id="appPopupMessage">Done.</p>
    <button type="button" class="ok-btn" id="appPopupOk">OK</button>
  </div>
</div>

</body>

</html>
