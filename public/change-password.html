<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Change Password</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#0b0f19;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
width:100%;
max-width:450px;
background:#161d2d;
padding:30px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.4);
}

h2{
text-align:center;
margin-bottom:25px;
color:#f59e0b;
}

.form-group{
margin-bottom:18px;
}

.form-group label{
display:block;
margin-bottom:6px;
}

.password-box{
position:relative;
}

.password-box input{
width:100%;
padding:14px;
background:#20293d;
border:none;
border-radius:10px;
color:white;
font-size:15px;
}

.password-box i{
position:absolute;
right:15px;
top:15px;
cursor:pointer;
color:#9ca3af;
}

.strength{
margin-top:8px;
font-size:14px;
font-weight:bold;
}

button{
width:100%;
padding:15px;
background:#f59e0b;
border:none;
border-radius:10px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#ffb300;
}

.message{
margin-top:15px;
text-align:center;
font-weight:bold;
color:#10b981;
}


/* ===== Custom App Popup ===== */
.app-popup-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.72);
  display:none;align-items:center;justify-content:center;
  z-index:99999;padding:20px;
  backdrop-filter:blur(4px);
}
.app-popup-overlay.open{display:flex;animation:appPopupFade .2s ease;}
@keyframes appPopupFade{from{opacity:0}to{opacity:1}}
.app-popup{
  background:#161d2d;border:1px solid #2a3548;border-radius:18px;
  width:100%;max-width:340px;padding:28px 24px 22px;
  text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.55);
  animation:appPopupUp .25s ease;
}
@keyframes appPopupUp{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.app-popup .brand{
  font-size:.75rem;font-weight:700;letter-spacing:.12em;
  color:#f59e0b;text-transform:uppercase;margin-bottom:14px;
}
.app-popup .icon{
  width:56px;height:56px;border-radius:50%;margin:0 auto 14px;
  display:flex;align-items:center;justify-content:center;font-size:1.5rem;
}
.app-popup.success .icon{background:rgba(16,185,129,.15);color:#10b981;}
.app-popup.error .icon{background:rgba(239,68,68,.15);color:#ef4444;}
.app-popup.info .icon{background:rgba(245,158,11,.15);color:#f59e0b;}
.app-popup h3{color:#fff;font-size:1.15rem;margin-bottom:8px;font-weight:600;}
.app-popup p{color:#9ca3af;font-size:.9rem;line-height:1.45;margin-bottom:20px;}
.app-popup .ok-btn{
  width:100%;padding:12px;border:none;border-radius:10px;
  background:#f59e0b;color:#111;font-weight:700;font-size:.95rem;
  cursor:pointer;font-family:inherit;
}
.app-popup .ok-btn:hover{background:#d97706;}
.app-popup .ok-btn:disabled{opacity:.7;cursor:not-allowed;}

</style>

</head>

<body>

<div class="container">

<h2>Change Password</h2>

<form id="passwordForm">

<div class="form-group">

<label>Current Password</label>

<div class="password-box">

<input
type="password"
id="currentPassword"
required>

<i class="fa-solid fa-eye toggle"></i>

</div>

</div>

<div class="form-group">

<label>New Password</label>

<div class="password-box">

<input
type="password"
id="newPassword"
required>

<i class="fa-solid fa-eye toggle"></i>

</div>

<div
class="strength"
id="strength">

Password Strength

</div>

</div>

<div class="form-group">

<label>Confirm New Password</label>

<div class="password-box">

<input
type="password"
id="confirmPassword"
required>

<i class="fa-solid fa-eye toggle"></i>

</div>

</div>

<button type="submit">

Update Password

</button>

<div
class="message"
id="message">

</div>

</form>

</div>
<script>

function showAppPopup(options){
  const opts = typeof options === 'string' ? { message: options, type: 'info' } : (options || {});
  const type = opts.type || 'info';
  const title = opts.title || (type === 'success' ? 'Success' : type === 'error' ? 'Error' : 'Notice');
  const message = opts.message || '';
  const onOk = opts.onOk || null;
  let overlay = document.getElementById('appPopupOverlay');
  if (!overlay) {
    document.body.insertAdjacentHTML('beforeend', `
<div class="app-popup-overlay" id="appPopupOverlay">
  <div class="app-popup success" id="appPopup">
    <div class="brand">JAZTECH</div>
    <div class="icon" id="appPopupIcon"><i class="fa-solid fa-check"></i></div>
    <h3 id="appPopupTitle">Success</h3>
    <p id="appPopupMessage">Done.</p>
    <button type="button" class="ok-btn" id="appPopupOk">OK</button>
  </div>
</div>
`);
    overlay = document.getElementById('appPopupOverlay');
  }
  const box = document.getElementById('appPopup');
  const icon = document.getElementById('appPopupIcon');
  const titleEl = document.getElementById('appPopupTitle');
  const msgEl = document.getElementById('appPopupMessage');
  const okBtn = document.getElementById('appPopupOk');
  box.className = 'app-popup ' + type;
  if (type === 'success') icon.innerHTML = '<i class="fa-solid fa-check"></i>';
  else if (type === 'error') icon.innerHTML = '<i class="fa-solid fa-xmark"></i>';
  else icon.innerHTML = '<i class="fa-solid fa-circle-info"></i>';
  titleEl.textContent = title;
  msgEl.textContent = message;
  overlay.classList.add('open');
  okBtn.onclick = function(){
    overlay.classList.remove('open');
    if (typeof onOk === 'function') onOk();
  };
}
// Prevent double-submit on forms
function lockButton(btn, loadingText){
  if (!btn) return function unlock(){};
  if (btn.dataset.locked === '1') return null; // already locked
  btn.dataset.locked = '1';
  btn.dataset.prevText = btn.innerHTML;
  btn.disabled = true;
  btn.style.opacity = '0.7';
  btn.style.cursor = 'not-allowed';
  if (loadingText) btn.innerHTML = loadingText;
  return function unlock(){
    btn.dataset.locked = '0';
    btn.disabled = false;
    btn.style.opacity = '';
    btn.style.cursor = '';
    btn.innerHTML = btn.dataset.prevText || btn.innerHTML;
  };
}



// Show/Hide Password

document.querySelectorAll(".toggle").forEach((icon)=>{

icon.addEventListener("click",()=>{

const input=icon.previousElementSibling;

if(input.type==="password"){

input.type="text";

icon.classList.remove("fa-eye");

icon.classList.add("fa-eye-slash");

}else{

input.type="password";

icon.classList.remove("fa-eye-slash");

icon.classList.add("fa-eye");

}

});

});

// Password Strength

const newPassword=document.getElementById("newPassword");

const strength=document.getElementById("strength");

newPassword.addEventListener("input",()=>{

const value=newPassword.value;

if(value.length<8){

strength.innerHTML="Weak Password";

strength.style.color="#ef4444";

}else if(

/^(?=.*[A-Za-z])(?=.*\d).{8,}$/.test(value)

){

strength.innerHTML="Medium Password";

strength.style.color="#f59e0b";

}

if(

/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?#&]).{8,}$/.test(value)

){

strength.innerHTML="Strong Password";

strength.style.color="#10b981";

}

});

// Change Password

document.getElementById("passwordForm")

.addEventListener("submit",async(e)=>{

e.preventDefault();

const currentPassword=

document.getElementById("currentPassword").value;

const password=

document.getElementById("newPassword").value;

const confirmPassword=

document.getElementById("confirmPassword").value;

if(password!==confirmPassword){

showAppPopup({ type: 'info', title: 'Notice', message: 'Passwords do not match.' });

return;

}

if(password.length<8){

showAppPopup({ type: 'error', title: 'Error', message: 'Password must be at least 8 characters.' });

return;

}

try{

const response=await fetch("/api/change-password",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

currentPassword,

newPassword:password

})

});

const result=await response.json();

if(response.ok){

document.getElementById("message").innerHTML=

"✅ Password changed successfully.";

document.getElementById("passwordForm").reset();

strength.innerHTML="Password Strength";

strength.style.color="white";

}else{

showAppPopup({ type: 'error', title: 'Error', message: result.message || 'Unable to change password.' });

}

}catch(error){

console.error(error);

showAppPopup({ type: 'error', title: 'Error', message: 'Server connection failed.' });

}

});

</script>


<div class="app-popup-overlay" id="appPopupOverlay">
  <div class="app-popup success" id="appPopup">
    <div class="brand">JAZTECH</div>
    <div class="icon" id="appPopupIcon"><i class="fa-solid fa-check"></i></div>
    <h3 id="appPopupTitle">Success</h3>
    <p id="appPopupMessage">Done.</p>
    <button type="button" class="ok-btn" id="appPopupOk">OK</button>
  </div>
</div>

</body>

</html>
