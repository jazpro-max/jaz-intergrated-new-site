<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Notifications</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#0b0f19;
color:white;
padding-bottom:90px;
}

header{
background:#111827;
padding:18px;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
border-bottom:1px solid #1f2937;
z-index:100;
}

header h2{
color:#f59e0b;
}

.container{
max-width:800px;
margin:auto;
padding:16px;
}

.actions{
display:flex;
justify-content:space-between;
margin-bottom:18px;
}

button{
background:#f59e0b;
color:#000;
border:none;
padding:10px 18px;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

.notification{

background:#161d2d;
padding:18px;
border-radius:15px;
margin-bottom:15px;
display:flex;
gap:15px;
align-items:flex-start;

}

.icon{

width:45px;
height:45px;
border-radius:50%;
background:#20293d;
display:flex;
align-items:center;
justify-content:center;
color:#f59e0b;
font-size:20px;

}

.content{

flex:1;

}

.content h3{

margin-bottom:6px;

}

.content p{

color:#9ca3af;
font-size:14px;
line-height:1.5;

}

.time{

margin-top:8px;
font-size:12px;
color:#6b7280;

}

.unread{

border-left:4px solid #f59e0b;

}

.read{

opacity:.75;

}

.bottom-nav{

position:fixed;
bottom:0;
left:0;
width:100%;
background:#111827;
display:flex;
justify-content:space-around;
padding:12px 0;

}

.bottom-nav a{

display:flex;
flex-direction:column;
align-items:center;
text-decoration:none;
color:#9ca3af;
font-size:13px;

}

.bottom-nav a.active{

color:#f59e0b;

}

</style>

</head>

<body>

<header>

<h2>Notifications</h2>

<i class="fa-solid fa-bell fa-lg"></i>

</header>

<div class="container">

<div class="actions">

<button onclick="markAllRead()">

Mark All Read

</button>

<button onclick="deleteAll()">

Delete All

</button>

</div>

<div id="notificationList">

</div>

</div>
<!-- Bottom Navigation -->

<nav class="bottom-nav">

<a href="index.html">

<i class="fa-solid fa-house"></i>

<span>Home</span>

</a>

<a href="order.html">

<i class="fa-solid fa-chart-line"></i>

<span>Orders</span>

</a>

<a href="team.html">

<i class="fa-solid fa-users"></i>

<span>Team</span>

</a>

<a href="me.html" class="active">

<i class="fa-solid fa-user"></i>

<span>Me</span>

</a>

</nav>

<script>
function getToken() {
  return localStorage.getItem('token') || sessionStorage.getItem('token');
}
function authHeaders() {
  const h = { 'Content-Type': 'application/json' };
  const t = getToken();
  if (t) h['Authorization'] = 'Bearer ' + t;
  return h;
}
function requireAuth() {
  if (!getToken()) { window.location.href = 'login.html'; return false; }
  return true;
}

let notifications = [];

function isRead(item) {
  if (item.user) return !!item.isRead;
  // global announcement: check readBy
  const uid = (JSON.parse(localStorage.getItem('user') || '{}').id || '');
  if (item.readBy && Array.isArray(item.readBy)) {
    return item.readBy.some(id => String(id) === String(uid));
  }
  return !!item.isRead;
}

async function loadNotifications() {
  if (!requireAuth()) return;
  try {
    const response = await fetch('/api/notifications', { headers: authHeaders() });
    if (response.status === 401) { window.location.href = 'login.html'; return; }
    const payload = await response.json();
    notifications = payload.notifications || payload || [];
    if (!Array.isArray(notifications)) notifications = [];
    renderNotifications();
  } catch (error) {
    console.error(error);
    const list = document.getElementById('notificationList');
    if (list) list.innerHTML = '<div class="notification"><p>Unable to load notifications.</p></div>';
  }
}

function renderNotifications() {
  const list = document.getElementById('notificationList');
  if (!list) return;

  if (!notifications.length) {
    list.innerHTML = `
      <div class="notification">
        <div class="content">
          <h3>No notifications</h3>
          <p>You have no notifications.</p>
        </div>
      </div>`;
    return;
  }

  list.innerHTML = notifications.map(item => {
    const id = item._id || item.id;
    const read = isRead(item);
    const title = item.title || 'Notification';
    const message = item.message || '';
    const date = item.createdAt ? new Date(item.createdAt).toLocaleString() : '';
    const type = item.type || 'info';
    return `
      <div class="notification ${read ? 'read' : 'unread'}">
        <div class="content">
          <h3>${title}</h3>
          <p>${message}</p>
          <small style="color:#9ca3af;">${type} · ${date}</small>
        </div>
        <div class="actions" style="margin-top:10px;">
          ${!read ? `<button onclick="markRead('${id}')">Mark Read</button>` : ''}
          <button style="background:#ef4444;margin-left:8px;color:white;" onclick="deleteNotification('${id}')">Delete</button>
        </div>
      </div>`;
  }).join('');
}

async function markRead(id) {
  try {
    await fetch('/api/notifications/' + id + '/read', {
      method: 'PUT',
      headers: authHeaders()
    });
    loadNotifications();
  } catch (error) { console.error(error); }
}

async function deleteNotification(id) {
  if (!confirm('Delete this notification?')) return;
  try {
    await fetch('/api/notifications/' + id, {
      method: 'DELETE',
      headers: authHeaders()
    });
    loadNotifications();
  } catch (error) { console.error(error); }
}

async function markAllRead() {
  try {
    await fetch('/api/notifications/read-all', {
      method: 'PUT',
      headers: authHeaders()
    });
    loadNotifications();
  } catch (error) { console.error(error); }
}

async function deleteAll() {
  if (!confirm('Delete all personal notifications?')) return;
  try {
    await fetch('/api/notifications', {
      method: 'DELETE',
      headers: authHeaders()
    });
    loadNotifications();
  } catch (error) { console.error(error); }
}

loadNotifications();
</script>

</body>

</html>
